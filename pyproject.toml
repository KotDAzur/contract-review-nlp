[project]
name = "contract-review-nlp"
version = "0.1.0"
description = "Assistant de revue de contrats : classification de clauses, retrieval et audit (LEDGAR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "scikit-learn",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "sentencepiece>=0.2.2",
]

# Sur Windows, torch de PyPI est CPU seulement : on prend la build CUDA officielle.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_review"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
