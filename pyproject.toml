[project]
name = "contract-review-nlp"
version = "0.1.0"
description = "Assistant de revue de contrats : classification de clauses, retrieval et audit (LEDGAR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "scikit-learn",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_review"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
