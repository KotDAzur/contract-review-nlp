seed: 42
data:
  dataset: coastalcph/lex_glue
  subset: ledgar
  revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c
classification:
  max_len: 256
  batch_size: 32
  eval_batch_size: 128
  epochs: 5
  lr: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  patience: 2
  fp16: true
  class_weights: null
  model: nlpaueb/legal-bert-base-uncased
retrieval:
  n_queries: 1000
  k: 10
  top_labels: 2
  hybrid_model: bge
  max_seq_length: 256
  queries_file: configs/lawyer_queries.yaml
  dense_models:
    minilm:
      name: sentence-transformers/all-MiniLM-L6-v2
      query_prefix: ''
    bge:
      name: BAAI/bge-small-en-v1.5
      query_prefix: 'Represent this sentence for searching relevant passages: '
evaluation:
  n_bootstrap: 1000
  target_precision: 0.97
  ece_bins: 15
audit:
  n_bootstrap: 5000
  alpha: 0.05
  min_slice_size: 50
  samples_per_slice: 30
  ood_file: configs/ood_clauses.yaml
  translated_clauses: 300
  translation_model: Helsinki-NLP/opus-mt-en-fr
synonym_groups:
