seed: 42

data:
  dataset: coastalcph/lex_glue
  subset: ledgar
  revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c  # version figée du dataset

classification:
  max_len: 256
  batch_size: 32
  eval_batch_size: 128
  epochs: 5
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  patience: 2  # early stopping sur le macro-F1 de validation
  fp16: true  # actif seulement si CUDA est disponible
  class_weights: null  # null ou sqrt_inv

retrieval:
  n_queries: 1000  # clauses de test servant de requêtes
  k: 10
  top_labels: 2  # types retenus par le routage question -> type
  hybrid_model: bge
  max_seq_length: 256
  queries_file: configs/lawyer_queries.yaml
  dense_models:
    minilm:
      name: sentence-transformers/all-MiniLM-L6-v2
      query_prefix: ""
    bge:
      name: BAAI/bge-small-en-v1.5
      query_prefix: "Represent this sentence for searching relevant passages: "  # questions seulement
evaluation:
  n_bootstrap: 1000
  target_precision: 0.97  # seuil de confiance choisi sur la validation
  ece_bins: 15

audit:
  n_bootstrap: 1000
  alpha: 0.05  # seuil après correction de Holm
  min_slice_size: 50  # en dessous, la tranche n'est pas testée
  samples_per_slice: 30  # clauses à relire pour juger les regex de tranches
  ood_file: configs/ood_clauses.yaml
  translated_clauses: 300  # clauses de test traduites en français
  translation_model: Helsinki-NLP/opus-mt-en-fr

# Labels quasi synonymes dans LEDGAR (les titres de section varient d'un contrat à l'autre).
# Sert à l'accuracy tolérante, au retrieval tolérant et à l'audit.
synonym_groups:
  - [Indemnifications, Indemnity]
  - [Waivers, No Waivers]
  - [Governing Laws, Applicable Laws]
  - [Amendments, Modifications]
  - [Entire Agreements, Integration]
  - [Jurisdictions, Submission To Jurisdiction, Consent To Jurisdiction, Venues]
  - [Successors, Assigns, Binding Effects, Assignments]
  - [Tax Withholdings, Withholdings]
  - [Definitions, Defined Terms]
  - [Costs, Expenses, Fees]
  - [Representations, Warranties]
